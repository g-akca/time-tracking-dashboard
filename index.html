<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Time Tracking Dashboard</title>
  </head>
  <body>
    <main>
      <header>
        <div id="user-div">
          <img id="user-img" src="images/image-jeremy.png" alt="Image of a woman smiling">
          <div id="user-info">
            <p>Report for</p>
            <p id="user-name">Jeremy Robson</p>
          </div>
        </div>

        <nav>
          <ul id="nav-list">
            <li>Daily</li>
            <li class="active-tab">Weekly</li>
            <li>Monthly</li>
          </ul>
        </nav>
      </header>

      <section class="card-section" id="work">
        <div class="card-header">
          <img src="images/icon-work.svg">
        </div>
        <div class="card-main">
          <div>
            <p class="task-name">Work</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p class="task-duration">32hrs</p>
            <p class="task-last">Last Week - 36hrs</p>
          </div>
        </div>
      </section>

      <section class="card-section" id="play">
        <div class="card-header">
          <img src="images/icon-play.svg">
        </div>
        <div class="card-main">
          <div>
            <p class="task-name">Play</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p class="task-duration">10hrs</p>
            <p class="task-last">Last Week - 8hrs</p>
          </div>
        </div>
      </section>

      <section class="card-section" id="study">
        <div class="card-header">
          <img src="images/icon-study.svg">
        </div>
        <div class="card-main">
          <div>
            <p class="task-name">Study</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p class="task-duration">4hrs</p>
            <p class="task-last">Last Week - 7hrs</p>
          </div>
        </div>
      </section>

      <section class="card-section" id="exercise">
        <div class="card-header">
          <img src="images/icon-exercise.svg">
        </div>
        <div class="card-main">
          <div>
            <p class="task-name">Exercise</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p class="task-duration">4hrs</p>
            <p class="task-last">Last Week - 5hrs</p>
          </div>
        </div>
      </section>

      <section class="card-section" id="social">
        <div class="card-header">
          <img src="images/icon-social.svg">
        </div>
        <div class="card-main">
          <div>
            <p class="task-name">Social</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p class="task-duration">5hrs</p>
            <p class="task-last">Last Week - 10hrs</p>
          </div>
        </div>
      </section>

      <section class="card-section" id="self-care">
        <div class="card-header">
          <img src="images/icon-self-care.svg">
        </div>
        <div class="card-main">
          <div>
            <p class="task-name">Self Care</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p class="task-duration">2hrs</p>
            <p class="task-last">Last Week - 2hrs</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
