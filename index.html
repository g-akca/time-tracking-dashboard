<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Time Tracking Dashboard</title>
  </head>
  <body>
    <header>
      <div id="user-div">
        <img src="images/image-jeremy.png" alt="Image of a woman smiling">
        <div id="user-info">
          <p>Report for</p>
          <p>Jeremy Robson</p>
        </div>
      </div>

      <nav>
        <ul id="nav-list">
          <li>Daily</li>
          <li>Weekly</li>
          <li>Monthly</li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="task-section" id="work">
        <div class="task-header">
          <img src="images/icon-work.svg">
        </div>
        <div class="task-main">
          <div>
            <p>Work</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p>32hrs</p>
            <p>Last Week - 36hrs</p>
          </div>
        </div>
      </section>

      <section class="task-section" id="play">
        <div class="task-header">
          <img src="images/icon-play.svg">
        </div>
        <div class="task-main">
          <div>
            <p>Play</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p>10hrs</p>
            <p>Last Week - 36hrs</p>
          </div>
        </div>
      </section>

      <section class="task-section" id="study">
        <div class="task-header">
          <img src="images/icon-study.svg">
        </div>
        <div class="task-main">
          <div>
            <p>Study</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p>4hrs</p>
            <p>Last Week - 7hrs</p>
          </div>
        </div>
      </section>

      <section class="task-section" id="exercise">
        <div class="task-header">
          <img src="images/icon-exercise.svg">
        </div>
        <div class="task-main">
          <div>
            <p>Exercise</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p>4hrs</p>
            <p>Last Week - 5hrs</p>
          </div>
        </div>
      </section>

      <section class="task-section" id="social">
        <div class="task-header">
          <img src="images/icon-social.svg">
        </div>
        <div class="task-main">
          <div>
            <p>Social</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p>5hrs</p>
            <p>Last Week - 10hrs</p>
          </div>
        </div>
      </section>

      <section class="task-section" id="self-care">
        <div class="task-header">
          <img src="images/icon-self-care.svg">
        </div>
        <div class="task-main">
          <div>
            <p>Self Care</p>
            <img src="images/icon-ellipsis.svg">
          </div>
          <div>
            <p>2hrs</p>
            <p>Last Week - 2hrs</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
